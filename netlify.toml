[build]
  publish = "frontend"
  command = ""
  ignore = "exit 0"

[build.environment]
  NETLIFY_SKIP_FUNCTION_BUNDLING = "true"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_URL.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
